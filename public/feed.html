<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0f" />
    <title>Signal Board · Live · daily-ai-briefing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/feed.css" />
  </head>
  <body>
    <a class="sr-skip" href="#news-grid">跳到新闻</a>

    <!-- 装饰背景 -->
    <div class="bg-stage" aria-hidden="true">
      <div class="bg-orb bg-orb--emerald" style="top:-12rem;left:-10rem;width:42rem;height:42rem"></div>
      <div class="bg-orb bg-orb--cyan" style="top:35vh;right:-14rem;width:38rem;height:38rem"></div>
      <div class="bg-orb bg-orb--violet" style="bottom:-14rem;left:30vw;width:34rem;height:34rem"></div>
      <div class="bg-grid"></div>
      <div class="bg-grain"></div>
    </div>

    <!-- 顶部 header -->
    <header class="topbar">
      <a class="brand" href="/" aria-label="Signal Board 首页">
        <span class="brand__mark" aria-hidden="true"><span class="brand__mark-core"></span></span>
        <span class="brand__text">
          <span class="brand__title">Serenity</span>
          <span class="brand__sub">Signal · Board</span>
        </span>
      </a>
      <div class="topbar__meta">
        <span class="status-pill" id="status-pill"><span class="status-pill__dot"></span><span id="status-text" class="mono">就绪</span></span>
        <span class="date-pill mono" id="last-fetch">—</span>
        <button class="refresh-btn" id="refresh-btn" aria-label="刷新新闻">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a9 9 0 1 1-3.13-6.83"/><path d="M21 4v5h-5"/></svg>
          <span>刷新</span>
        </button>
      </div>
    </header>

    <main id="main" class="page">
      <!-- 今日 AI 整理日报(由 daily-briefing 定时任务每天聚合推送) -->
      <section class="digest" id="digest" aria-labelledby="digest-title" hidden>
        <div class="digest__accent" aria-hidden="true"></div>
        <header class="digest__head">
          <div class="digest__title-row">
            <span class="digest__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M12 2 4 7v10l8 5 8-5V7l-8-5z"/>
                <path d="M12 22V12"/><path d="m4 7 8 5 8-5"/>
              </svg>
            </span>
            <h2 class="digest__title" id="digest-title">今日 AI 整理日报</h2>
            <span class="digest__date mono" id="digest-date">—</span>
          </div>
          <p class="digest__meta mono" id="digest-meta">由 M3 聚合实时新闻</p>
        </header>
        <p class="digest__summary" id="digest-summary">—</p>
        <div class="digest__metrics" id="digest-metrics" role="list" aria-label="今日指标"></div>
        <div class="digest__items" id="digest-items">
          <div class="digest__col">
            <h3 class="digest__col-title digest__col-title--ai">AI 重点</h3>
            <ul class="digest__list" id="digest-ai-list"></ul>
          </div>
          <div class="digest__col">
            <h3 class="digest__col-title digest__col-title--market">市场重点</h3>
            <ul class="digest__list" id="digest-market-list"></ul>
          </div>
        </div>
      </section>

      <!-- 实时新闻区(全宽) -->
      <section class="news" id="news-grid" aria-labelledby="news-title">
        <div class="news__head">
          <div>
            <h1 class="news__title" id="news-title">实时新闻</h1>
            <p class="news__sub">
              <span class="news__count" id="news-count">— 条</span>
              <span class="news__sep">·</span>
              <span class="news__cache" id="fetch-pill">实时拉取 · 零缓存</span>
            </p>
          </div>
        </div>
        <div class="news__grid" id="news-grid-list" role="list" aria-label="新闻卡片"></div>
        <div class="news__empty" id="news-empty" hidden>
          <p>暂无新闻</p>
          <p class="news__empty-sub">刷新试试,或检查数据源</p>
        </div>
      </section>
    </main>

    <!-- Chat 浮窗按钮(右下) -->
    <button
      class="fab"
      id="chat-fab"
      type="button"
      aria-label="打开 AI 助手"
      aria-expanded="false"
      aria-controls="chat-modal"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
      </svg>
      <span class="fab__label">AI 助手</span>
    </button>

    <!-- Chat 弹窗(默认隐藏) -->
    <div
      class="chat-modal"
      id="chat-modal"
      role="dialog"
      aria-labelledby="chat-modal-title"
      aria-hidden="true"
      hidden
    >
      <div class="chat-modal__panel" role="document">
        <header class="chat-modal__head">
          <div class="chat-modal__title">
            <span class="chat-modal__dot" aria-hidden="true"></span>
            <span id="chat-modal-title">AI 助手</span>
            <span class="chat-modal__model mono" id="chat-model">—</span>
          </div>
          <div class="chat-modal__actions">
            <button class="icon-btn" id="chat-clear" type="button" aria-label="清空对话" title="清空">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
            </button>
            <button class="icon-btn" id="chat-close" type="button" aria-label="关闭" title="关闭">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
          </div>
        </header>
        <div class="chat-modal__body">
          <div class="chat-stream" id="chat-stream" role="log" aria-live="polite" aria-label="对话历史">
            <div class="msg msg--ai msg--welcome">
              <div class="msg__avatar msg__avatar--ai" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2 4 7v10l8 5 8-5V7l-8-5z"/><path d="M12 22V12"/><path d="m4 7 8 5 8-5"/></svg>
              </div>
              <div class="msg__bubble">
                <p class="msg__title">AI 助手已就位</p>
                <p class="msg__body">我看到页面上的实时新闻,可以基于这些内容问问题。试试:</p>
                <ul class="msg__suggest" id="suggest-list">
                  <li><button class="chip" data-q="今天 AI 行业最值得关注的 1 件事?">今天 AI 行业最值得关注的 1 件事?</button></li>
                  <li><button class="chip" data-q="半导体景气最近怎么走?">半导体景气最近怎么走?</button></li>
                  <li><button class="chip" data-q="市场情绪最近是偏多还是偏空?为什么?">市场情绪最近是偏多还是偏空?为什么?</button></li>
                  <li><button class="chip" data-q="避险需求指标变化趋势?">避险需求指标变化趋势?</button></li>
                </ul>
              </div>
            </div>
          </div>
        </div>
        <form class="chat-modal__input" id="chat-form" autocomplete="off">
          <textarea
            id="chat-input"
            class="chat-input__field"
            rows="1"
            placeholder="问点什么…(Enter 发送,Shift+Enter 换行)"
            aria-label="问题输入"
            maxlength="2000"
          ></textarea>
          <button type="submit" class="chat-send" id="chat-send" aria-label="发送" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
          </button>
        </form>
      </div>
    </div>

    <script src="/feed.js"></script>
  </body>
</html>
